name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: "Run lint, tests, typecheck, and build before deploy"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHEETFLARE_STAGING_GOOGLE_PRIVATE_KEY: ${{ secrets.SHEETFLARE_STAGING_GOOGLE_PRIVATE_KEY }}
      SHEETFLARE_STAGING_ADMIN_BEARER_TOKEN: ${{ secrets.SHEETFLARE_STAGING_ADMIN_BEARER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        env:
          SHEETFLARE_STAGING_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/contributor-staging.md
        run: npx tsx scripts/check-staging-secrets.ts

      - name: Validate repo
        if: ${{ inputs.run_checks }}
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build

      - name: Build admin UI
        run: npm --workspace @sheetflare/admin run build

      - name: Write staging secrets file
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('.wrangler-staging-secrets.json', JSON.stringify({ GOOGLE_PRIVATE_KEY: process.env.SHEETFLARE_STAGING_GOOGLE_PRIVATE_KEY, ADMIN_BEARER_TOKEN: process.env.SHEETFLARE_STAGING_ADMIN_BEARER_TOKEN }));"

      - name: Deploy staging worker
        working-directory: apps/api
        run: npx wrangler deploy --config wrangler.staging.jsonc --secrets-file ../../.wrangler-staging-secrets.json

      - name: Remove staging secrets file
        if: ${{ always() }}
        run: rm -f .wrangler-staging-secrets.json
